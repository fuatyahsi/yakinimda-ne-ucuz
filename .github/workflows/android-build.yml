name: Android Build

on:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: "Upload build artifacts"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-build.yml"
      - "android/**"
      - "assets/**"
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "test/**"

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        # Eski FridgeChef projesinden kalan test isimlerinin yerine bu
        # repo'daki gercek test dosyalari (lib/services icin yazildi).
        run: flutter test test/catalog_product_family_test.dart test/cosmetic_source_service_test.dart test/market_fiyati_source_service_test.dart test/product_category_test.dart test/smart_actueller_feed_service_test.dart test/smart_actueller_source_service_test.dart

      - name: Prepare Supabase client config
        shell: bash
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            SUPABASE_ANON_KEY="$SUPABASE_PUBLISHABLE_KEY"
          fi

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL + SUPABASE_ANON_KEY/SUPABASE_PUBLISHABLE_KEY secrets are required for configured Android APK/AAB builds. Tests will pass, but APK/AAB build steps are skipped."
            echo "BUILD_ANDROID_APP=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "BUILD_ANDROID_APP=true" >> "$GITHUB_ENV"
          {
            echo "SUPABASE_DART_DEFINES<<EOF"
            echo "--dart-define=SUPABASE_URL=$SUPABASE_URL"
            echo "--dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build debug APK
        if: ${{ env.BUILD_ANDROID_APP == 'true' }}
        shell: bash
        run: |
          readarray -t DART_DEFINES <<< "$SUPABASE_DART_DEFINES"
          flutter build apk --debug "${DART_DEFINES[@]}"

      - name: Android app build skipped
        if: ${{ env.BUILD_ANDROID_APP == 'false' }}
        run: echo "Android APK/AAB build skipped because Supabase client config secret is missing."

      - name: Upload debug APK artifact
        if: ${{ env.BUILD_ANDROID_APP == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.upload_artifacts == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: fridgechef-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Prepare Android release keystore
        if: ${{ env.BUILD_ANDROID_APP == 'true' && env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' && env.ANDROID_STORE_PASSWORD != '' }}
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build release APK
        if: ${{ env.BUILD_ANDROID_APP == 'true' && env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' && env.ANDROID_STORE_PASSWORD != '' }}
        shell: bash
        run: |
          readarray -t DART_DEFINES <<< "$SUPABASE_DART_DEFINES"
          flutter build apk --release "${DART_DEFINES[@]}"

      - name: Build release AAB
        if: ${{ env.BUILD_ANDROID_APP == 'true' && env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' && env.ANDROID_STORE_PASSWORD != '' }}
        shell: bash
        run: |
          readarray -t DART_DEFINES <<< "$SUPABASE_DART_DEFINES"
          flutter build appbundle --release "${DART_DEFINES[@]}"

      - name: Upload release APK artifact
        if: ${{ env.BUILD_ANDROID_APP == 'true' && env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' && env.ANDROID_STORE_PASSWORD != '' && github.event_name == 'workflow_dispatch' && github.event.inputs.upload_artifacts == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: fridgechef-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload release AAB artifact
        if: ${{ env.BUILD_ANDROID_APP == 'true' && env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' && env.ANDROID_STORE_PASSWORD != '' && github.event_name == 'workflow_dispatch' && github.event.inputs.upload_artifacts == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: fridgechef-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Release signing not configured
        if: ${{ env.BUILD_ANDROID_APP == 'true' && !(env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' && env.ANDROID_STORE_PASSWORD != '') }}
        run: echo "Release APK/AAB skipped because Android signing secrets are not configured."
